# ============================================================================
# 4090D 24 GiB full-run configuration, cloned from the protected 3090 baseline.
#
# This is a separate experiment. It preserves the effective global batch,
# optimizer-step schedule, data pipeline semantics, AMP setting, input sizes,
# loss weights, and FP32 tracker inference semantics of the canonical baseline.
# Physical batch is halved and accumulation is doubled to fit 24 GiB VRAM.
#
# Training:
#   export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONUNBUFFERED=1
#   /root/autodl-tmp/conda_envs/tbsi/bin/python -u tracking/train.py \
#     --script tbsi_track \
#     --config v1.0.1-单卡4090D-24G-等效全局128加速 \
#     --save_dir ./output --mode single
#
# Full test (FP32 tracker; use this exact command for comparable results):
#   export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONUNBUFFERED=1
#   TBSI_INFER_FP16=0 /root/autodl-tmp/conda_envs/tbsi/bin/python -u \
#     tracking/test.py tbsi_track \
#     v1.0.1-单卡4090D-24G-等效全局128加速 \
#     --dataset_name lasher_test --threads 0 --num_gpus 1
#
# Analysis:
#   /root/autodl-tmp/conda_envs/tbsi/bin/python -u \
#     tracking/analysis_results.py --tracker_name tbsi_track \
#     --tracker_param v1.0.1-单卡4090D-24G-等效全局128加速 \
#     --dataset_name lasher_test
#
# Output directories are generated from this unique experiment name:
#   output/experiments/v1.0.1-单卡4090D-24G-等效全局128加速/
#   output/test/tracking_results/tbsi_track/v1.0.1-单卡4090D-24G-等效全局128加速/
#
# Hardware record for the run: 1 x NVIDIA GeForce RTX 4090D, 24 GiB;
# 2 x Intel Xeon Platinum 8352S, 64 physical cores / 128 threads.
# The deployment memory budget is treated as 60 GB even though the current
# container reports a larger host-visible memory size.
# Keep seed 42, the LasHeR dataset/path, pretrained checkpoint, and code
# snapshot recorded separately in the run report.
# ============================================================================

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  - 0.449
  - 0.449
  - 0.449
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  - 0.226
  - 0.226
  - 0.226
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
      - LasHeR_train
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 59904
  VAL:
    DATASETS_NAME:
      - LasHeR_test
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_FILE: "TBSITrack_SOT_Pretrained.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_tbsi
    STRIDE: 16
    TBSI_LOC: [3, 6, 9]
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: True
  # 16 x 8 keeps the effective global batch at 128 and 468 updates/epoch.
  BATCH_SIZE: 16
  GRAD_ACCUM_STEPS: 8
  EPOCH: 15
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 10
  # Four workers match the previously validated stable setting. The prior
  # eight-worker run was killed by the DataLoader during epoch 1.
  NUM_WORKER: 4
  PREFETCH_FACTOR: 2
  PERSISTENT_WORKERS: False
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True

TEST:
  EPOCH: 15
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
