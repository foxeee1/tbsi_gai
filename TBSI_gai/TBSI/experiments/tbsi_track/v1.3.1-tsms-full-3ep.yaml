# Phase 1 preflight only. Same model/data/optimizer as v1.3.1-tsms-full-15ep;
# only EPOCH and TEST.EPOCH are shortened to 3 for normality checking.
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406, 0.449, 0.449, 0.449]
  STD: [0.229, 0.224, 0.225, 0.226, 0.226, 0.226]
  SEARCH: {CENTER_JITTER: 3, FACTOR: 4.0, SCALE_JITTER: 0.25, SIZE: 256, NUMBER: 1}
  TEMPLATE: {CENTER_JITTER: 0, FACTOR: 2.0, SCALE_JITTER: 0, SIZE: 128}
  TRAIN: {DATASETS_NAME: [LasHeR_train], DATASETS_RATIO: [1], SAMPLE_PER_EPOCH: 59904}
  VAL: {DATASETS_NAME: [LasHeR_test], DATASETS_RATIO: [1], SAMPLE_PER_EPOCH: 10000}
MODEL:
  PRETRAIN_FILE: TBSITrack_SOT_Pretrained.pth.tar
  EXTRA_MERGER: False
  RETURN_INTER: False
  RIMA: {ENABLE: True, SMSA_ENABLE: True, SMSA_RGB_ENABLE: True, SMSA_TIR_ENABLE: True, CTVM_ENABLE: False, CTVM_USE_SMSA_SUPPORT: True, CTVM_GAMMA_INIT: 0.01, CTVM_DETACH_INPUT: True, ENTMAX_ALPHA: 1.3, FP32_CORE: True, LOG_STATS: True}
  TSMS: {ENABLE: True, RHO: 0.20, LAMBDA_COV: 0.05, DILATION_TOKENS: 1.0, SOFTNESS_TOKENS: 0.5, LOG_STATS: True}
  BACKBONE: {TYPE: vit_base_patch16_224_tbsi, STRIDE: 16, TBSI_LOC: [3, 6, 9]}
  HEAD: {TYPE: CENTER, NUM_CHANNELS: 256}
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: True
  BATCH_SIZE: 32
  GRAD_ACCUM_STEPS: 4
  EPOCH: 3
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 10
  NUM_WORKER: 4
  PREFETCH_FACTOR: 2
  PERSISTENT_WORKERS: False
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER: {TYPE: step, DECAY_RATE: 0.1}
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True
TEST: {EPOCH: 3, SEARCH_FACTOR: 4.0, SEARCH_SIZE: 256, TEMPLATE_FACTOR: 2.0, TEMPLATE_SIZE: 128}
