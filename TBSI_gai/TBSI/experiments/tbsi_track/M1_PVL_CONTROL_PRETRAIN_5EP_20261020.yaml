# 5-epoch matched parent control for the two PVL position screens.
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406, 0.449, 0.449, 0.449]
  STD: [0.229, 0.224, 0.225, 0.226, 0.226, 0.226]
  SEARCH: {CENTER_JITTER: 3, FACTOR: 4.0, SIZE: 256, NUMBER: 1, SCALE_JITTER: 0.25}
  TEMPLATE: {CENTER_JITTER: 0, FACTOR: 2.0, SIZE: 128, NUMBER: 1, SCALE_JITTER: 0}
  TRAIN: {DATASETS_NAME: [LasHeR_train], DATASETS_RATIO: [1], SAMPLE_PER_EPOCH: 512}
  VAL: {DATASETS_NAME: [LasHeR_test], SAMPLE_PER_EPOCH: 128}
MODEL:
  PRETRAIN_FILE: TBSITrack_SOT.pth.tar
  INIT_CHECKPOINT: pretrained_models/TBSITrack_SOT.pth.tar
  BACKBONE: {TYPE: vit_base_patch16_224_tbsi, STRIDE: 16, TBSI_LOC: [3, 6, 9], TBSI_FUSION: tbsi_e}
  HEAD: {TYPE: CENTER, NUM_CHANNELS: 256}
  AMCM_RELIABILITY: {ENABLE: False, MODE: legacy, HIDDEN_DIM: 32, MAX_DELTA: 0.10, POSITION: pre_fusion, SUPERVISION: False, SUPERVISION_WEIGHT: 0.0, SUPERVISION_TEMPERATURE: 4.0}
  PVL: {ENABLE: False, POSITION: template_loc6, LOC: 6, ADAPTER_DIM: 64, BETA: 2.35}
TRAIN:
  AMCM_RELIABILITY_ONLY: False
  AMCM_RELIABILITY_JOINT: False
  AMCM_RELIABILITY_JOINT_HEAD: False
  AMCM_REPR_LOSS_ENABLE: False
  AMCM_REPR_LOSS_WEIGHT: 0.0
  AMCM_RESIDUAL_RANK_LOSS_ENABLE: False
  AMCM_RESIDUAL_RANK_LOSS_WEIGHT: 0.0
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: False
  BATCH_SIZE: 2
  GRAD_ACCUM_STEPS: 1
  EPOCH: 5
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 5
  NUM_WORKER: 4
  PREFETCH_FACTOR: 2
  PERSISTENT_WORKERS: False
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 16
  SCHEDULER: {TYPE: step, DECAY_RATE: 0.1}
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
  SAVE_EPOCHS: [5]
  ROLLING_CHECKPOINTS: False
TEST: {EPOCH: 5, SEARCH_FACTOR: 4.0, SEARCH_SIZE: 256, TEMPLATE_FACTOR: 2.0, TEMPLATE_SIZE: 128}
