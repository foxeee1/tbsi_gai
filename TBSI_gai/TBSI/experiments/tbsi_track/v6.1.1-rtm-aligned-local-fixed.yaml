# RTM aligned-local fixed rerun after experiment harness repairs.
DATA:
  MAX_SAMPLE_INTERVAL: 30
  MEAN: [0.485, 0.456, 0.406, 0.449, 0.449, 0.449]
  STD: [0.229, 0.224, 0.225, 0.226, 0.226, 0.226]
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 2
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME: [LasHeR_train]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME: [LasHeR_test]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 10000
MODEL:
  PRETRAIN_FILE: "TBSITrack_ep0015.pth.tar"
  STAGE2_BASELINE: "output/experiments/v1.0.0-完美基线-全量/checkpoints/TBSITrack_ep0015.pth.tar"
  RTM: True
  RTM_HIDDEN: 64
  RTM_SCALE: 0.10
  RTM_SIM_THRESHOLD: 0.35
  RTM_SIM_TEMPERATURE: 0.10
  RTM_TRAIN_NOISE: 0.02
  RTM_TRAIN_DROP: 0.10
  RTM_MIN_PEAK: 0.40
  RTM_MIN_SIM: 0.45
  RTM_MOMENTUM: 0.95
  RTM_MAX_MOTION: 1.50
  RTM_MAX_SCALE_CHANGE: 0.70
  BACKBONE:
    TYPE: vit_base_patch16_224_tbsi
    STRIDE: 16
    TBSI_LOC: [3, 6, 9]
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  BATCH_SIZE: 32
  EPOCH: 10
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 8
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True
  PERSISTENT_WORKERS: True
  PREFETCH_FACTOR: 4
  SAVE_EPOCHS: [6, 8, 10]
TEST:
  EPOCH: 10
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
