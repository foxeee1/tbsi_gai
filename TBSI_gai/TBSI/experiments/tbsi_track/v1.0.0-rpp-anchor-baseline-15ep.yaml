# ============================================================================
# TBSI 单卡 RTX 3090 (48 GiB) 等效原始四卡训练配置。
#
# 原论文：4 x A100，每卡 batch=32，总 batch=128。
# 当前硬件：1 x RTX 3090，显存 48 GiB。
# 通过 4 步梯度累积保持有效 batch=128，避免直接申请 batch=128 超出显存。
#
# 原始每卡 DistributedSampler 在 60000 样本下配合 drop_last 后，
# 每卡实际使用 14976 个样本，即全局每 epoch 59904 个样本、468 次更新。
# 因此单卡配置显式使用 59904，保证每个 epoch 的 optimizer.step 数一致。

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  - 0.449
  - 0.449
  - 0.449
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  - 0.226
  - 0.226
  - 0.226
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
      - RPP_LasHeR_train
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10783
  VAL:
    DATASETS_NAME:
      - rpp_lasher_test
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_FILE: "TBSITrack_SOT_Pretrained.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_tbsi
    STRIDE: 16
    TBSI_LOC: [3, 6, 9]
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: True
  BATCH_SIZE: 32
  GRAD_ACCUM_STEPS: 4
  EPOCH: 15
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 10
  # PyTorch 1.9 + fork can kill persistent workers during validation.
  # Four workers are sufficient on the current host and are more stable.
  NUM_WORKER: 4
  PREFETCH_FACTOR: 2
  PERSISTENT_WORKERS: False
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True

TEST:
  EPOCH: 15
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
