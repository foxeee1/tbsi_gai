# ==============================================================================
# [全量v2] DGSFusion v4-diffproj + ROUTER_LR: 修复路由器训练
# ==============================================================================
# 基于 v1.5.0-v4-diffproj-全量（v1），仅改 2 个训练超参:
#   1. ROUTER_LR=0.001: 路由器学习率 = backbone 10 倍
#   2. GRAD_CLIP_NORM=1.0: 放宽梯度裁剪，防止路由器梯度被 backbone 梯度淹没
#   其他所有配置（EPOCH=15, LR_DROP_EPOCH=10, NUM_WORKER=8 等）与 v1 完全一致
# ==============================================================================

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  - 0.449
  - 0.449
  - 0.449
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  - 0.226
  - 0.226
  - 0.226
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
      - LasHeR_train
    DATASETS_RATIO:
      - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
    - LasHeR_test
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000
MODEL:
  PRETRAIN_FILE: "TBSITrack_SOT_Pretrained.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  DGSFUSION: True
  DGS_MODE: "v4"
  BACKBONE:
    TYPE: vit_base_patch16_224_tbsi
    STRIDE: 16
    TBSI_LOC: [3, 6, 9]
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: True
  BATCH_SIZE: 32
  EPOCH: 15
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 1.0          # 🆕 从 0.1 放宽到 1.0（唯一改动1）
  LR: 0.0001
  LR_DROP_EPOCH: 10
  ROUTER_LR: 0.001             # 🆕 路由器 10 倍学习率（唯一改动2）
  NUM_WORKER: 8                # 与 v1 一致
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True
  PERSISTENT_WORKERS: True
  PREFETCH_FACTOR: 4           # 与 v1 一致
  SAVE_EPOCHS: [15]
TEST:
  EPOCH: 15
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
