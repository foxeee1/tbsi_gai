# Early-conditioned MSHA gate, full M1-contract joint training.
# This run starts from the public TBSI SOT pretraining and trains the complete
# tracker together with the enabled early-conditioned cross-modal Value gate.
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406, 0.449, 0.449, 0.449]
  STD: [0.229, 0.224, 0.225, 0.226, 0.226, 0.226]
  SEARCH: {CENTER_JITTER: 3, FACTOR: 4.0, SIZE: 256, NUMBER: 1, SCALE_JITTER: 0.25}
  TEMPLATE: {CENTER_JITTER: 0, FACTOR: 2.0, SIZE: 128, NUMBER: 1, SCALE_JITTER: 0}
  TRAIN: {DATASETS_NAME: [LasHeR_train], DATASETS_RATIO: [1], SAMPLE_PER_EPOCH: 59904}
  VAL: {DATASETS_NAME: [LasHeR_test], SAMPLE_PER_EPOCH: 10000}
MODEL:
  PRETRAIN_FILE: TBSITrack_SOT_Pretrained.pth.tar
  INIT_CHECKPOINT: ''
  BACKBONE: {TYPE: vit_base_patch16_224_tbsi, STRIDE: 16, TBSI_LOC: [3, 6, 9], TBSI_FUSION: tbsi_e, EARLY_CONDITIONED_CROSS_GATE: True, EARLY_GATE_HIDDEN: 32}
  HEAD: {TYPE: CENTER, NUM_CHANNELS: 256}
  AMCM_RELIABILITY: {ENABLE: False, MODE: legacy, HIDDEN_DIM: 32, MAX_DELTA: 0.10, POSITION: pre_fusion, SUPERVISION: False, SUPERVISION_WEIGHT: 0.0, SUPERVISION_TEMPERATURE: 4.0}
TRAIN:
  AMCM_RELIABILITY_ONLY: False
  EARLY_CONDITIONED_MSHA_GATE_ONLY: False
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: True
  BATCH_SIZE: 16
  GRAD_ACCUM_STEPS: 8
  EPOCH: 15
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 10
  NUM_WORKER: 4
  PREFETCH_FACTOR: 2
  PERSISTENT_WORKERS: False
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 128
  SCHEDULER: {TYPE: step, DECAY_RATE: 0.1}
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True
  SAVE_EPOCHS: [15]
  ROLLING_CHECKPOINTS: False
TEST: {EPOCH: 15, SEARCH_FACTOR: 4.0, SEARCH_SIZE: 256, TEMPLATE_FACTOR: 2.0, TEMPLATE_SIZE: 128}
