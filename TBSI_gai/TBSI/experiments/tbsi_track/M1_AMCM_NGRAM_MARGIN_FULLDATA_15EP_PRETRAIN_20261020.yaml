# Full-data, 15-epoch comparison under the corrected protocol: initialize
# only from TBSITrack_SOT_Pretrained.pth.tar, never from protected M1.
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406, 0.449, 0.449, 0.449]
  STD: [0.229, 0.224, 0.225, 0.226, 0.226, 0.226]
  SEARCH: {CENTER_JITTER: 3, FACTOR: 4.0, SIZE: 256, NUMBER: 1, SCALE_JITTER: 0.25}
  TEMPLATE: {CENTER_JITTER: 0, FACTOR: 2.0, SIZE: 128, NUMBER: 1, SCALE_JITTER: 0}
  TRAIN: {DATASETS_NAME: [LasHeR_train], DATASETS_RATIO: [1], SAMPLE_PER_EPOCH: 59904}
  VAL: {DATASETS_NAME: [LasHeR_test], DATASETS_RATIO: [1], SAMPLE_PER_EPOCH: 10000}
MODEL:
  PRETRAIN_FILE: TBSITrack_SOT_Pretrained.pth.tar
  INIT_CHECKPOINT: ''
  BACKBONE: {TYPE: vit_base_patch16_224_tbsi, STRIDE: 16, TBSI_LOC: [3, 6, 9], TBSI_FUSION: tbsi_e}
  HEAD: {TYPE: CENTER, NUM_CHANNELS: 256}
  AMCM_RELIABILITY: {ENABLE: True, MODE: ngram_local_fusion, HIDDEN_DIM: 32, MAX_DELTA: 0.10, POSITION: pre_fusion, SUPERVISION: False, SUPERVISION_WEIGHT: 0.0, SUPERVISION_TEMPERATURE: 4.0}
TRAIN:
  AMCM_RELIABILITY_ONLY: True
  AMCM_REPR_LOSS_ENABLE: True
  AMCM_REPR_LOSS_WEIGHT: 0.50
  AMCM_REPR_LOSS_MARGIN: 0.05
  AMCM_REPR_LOSS_TOPK: 8
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  TBSI_DROP_PATH: [0.0, 0.0, 0.0]
  SOT_PRETRAIN: False
  BATCH_SIZE: 16
  GRAD_ACCUM_STEPS: 8
  EPOCH: 15
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 15
  NUM_WORKER: 4
  PREFETCH_FACTOR: 2
  PERSISTENT_WORKERS: False
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 128
  SCHEDULER: {TYPE: step, DECAY_RATE: 0.1}
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: True
  SAVE_EPOCHS: [15]
  ROLLING_CHECKPOINTS: False
TEST: {EPOCH: 15, SEARCH_FACTOR: 4.0, SEARCH_SIZE: 256, TEMPLATE_FACTOR: 2.0, TEMPLATE_SIZE: 128}
